<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Administrativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .formulario { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .fila-password { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .fila-password input { margin-bottom: 0; }
        button { width: 100%; padding: 12px; background: #003366; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .error { color: red; font-size: 12px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="formulario">
        <h2 style="text-align: center; color: #003366;">Alta de Administrador</h2>
        
        <input type="text" id="nombres" placeholder="Nombres" required>
        <input type="text" id="apellidos" placeholder="Apellidos" required>
        <input type="text" inputmode="numeric" pattern="[0-9]*" id="documento" placeholder="Documento de Identidad (Usuario)" required>
        
        <!-- Casilla de correo electrónico -->
        <input type="email" id="correo" placeholder="Correo Electrónico de contacto" required>
        
        <select id="entidad-principal" required>
            <option value="">Seleccione Entidad Base...</option>
            <option value="Gobernacion">Gobernación</option>
            <option value="Alcaldia">Alcaldía</option>
        </select>

        <select id="tipo-dependencia" required onchange="actualizarGuia()">
            <option value="">¿Dónde trabaja?...</option>
            <option value="Secretaria">Secretaría</option>
            <option value="Colegio">Colegio Institucional</option>
            <option value="Otro">Otra Dependencia</option>
        </select>

        <input type="text" id="nombre-especifico" placeholder="Especifique el nombre del lugar" required>
        <input type="text" id="cargo" placeholder="Cargo que desempeña" required>

        <div class="fila-password">
            <input type="password" id="clave" placeholder="Contraseña" required>
            <button type="button" id="btn-ver" style="width: auto; padding: 10px;">Ver</button>
        </div>
        <input type="password" id="clave-repetida" placeholder="Repetir Contraseña" required>

        <p id="mensaje-error" class="error"></p>

        <label style="display: flex; gap: 10px; align-items: center; font-size: 12px; margin-bottom: 20px;">
            <input type="checkbox" id="terminos" style="width: auto; margin: 0;" required>
            Confirmo que los datos son correctos y acepto el registro.
        </label>

        <button onclick="registrarDirecto()">Registrar Usuario</button>
    </div>

    <script>
        const supabaseUrl = 'https://wcdxgzopaghmcqqvbluk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjZHhnem9wYWdobWNxcXZibHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODIxODQsImV4cCI6MjEwMzc1ODE4NH0.-LGiK5alHalxQ5b8c5XE_H3o-fIWB4Mj4tVZKpEYuyQ'; 
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        function actualizarGuia() {
            const tipo = document.getElementById('tipo-dependencia').value;
            const inputNombre = document.getElementById('nombre-especifico');
            if (tipo === 'Secretaria') inputNombre.placeholder = "Ej: Secretaría de Cultura";
            else if (tipo === 'Colegio') inputNombre.placeholder = "Ej: Colegio San Francisco de Sales";
            else inputNombre.placeholder = "Especifique el nombre del lugar";
        }

        document.getElementById('btn-ver').addEventListener('click', function() {
            const campo = document.getElementById('clave');
            const campoRepetido = document.getElementById('clave-repetida');
            const tipo = campo.type === 'password' ? 'text' : 'password';
            campo.type = tipo;
            campoRepetido.type = tipo;
            this.textContent = tipo === 'password' ? 'Ver' : 'Ocultar';
        });

        async function registrarDirecto() {
            const clave = document.getElementById('clave').value;
            const claveRep = document.getElementById('clave-repetida').value;
            const error = document.getElementById('mensaje-error');
            const terminos = document.getElementById('terminos').checked;
            const documento = document.getElementById('documento').value;
            const correo = document.getElementById('correo').value;
            
            const reglaFuerte = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;

            if (!terminos || clave !== claveRep || !reglaFuerte.test(clave) || !documento || !correo) {
                error.textContent = "Revisa los campos: Acepta los términos, ingresa el correo, verifica que las contraseñas coincidan y cumplan las reglas de seguridad.";
                error.style.display = "block"; return;
            }
            error.style.display = "none";

            try {
                const { error: perfilError } = await clienteSupabase.from('perfiles_administrativos').insert([{
                    documento: documento,
                    nombres: document.getElementById('nombres').value,
                    apellidos: document.getElementById('apellidos').value,
                    correo: correo,
                    entidad_base: document.getElementById('entidad-principal').value,
                    tipo_dependencia: document.getElementById('tipo-dependencia').value,
                    nombre_lugar: document.getElementById('nombre-especifico').value,
                    cargo: document.getElementById('cargo').value,
                    clave: clave,
                    rol: 'administrador'
                }]);

                if (perfilError) throw perfilError;

                alert('¡Usuario registrado con éxito en la base de datos!');
                window.location.reload(); 

            } catch (err) {
                alert('Error al registrar (Es posible que el documento ya esté registrado): ' + err.message);
            }
        }
    </script>
</body>
</html>
