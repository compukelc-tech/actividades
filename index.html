<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Portal Multimedia Institucional - compukelc</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@500;700&family=Roboto:wght@500;700;900&family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="franja-superior"></div>

    <div class="barra-sesion" id="barra-admin" style="display: none;">
        <span id="info-usuario-activo"></span>
        <a href="admin.html" id="link-panel-admin" style="display: none;">⚙️ Panel Admin</a>
        <a href="registro.html" id="link-registro" style="display: none;">+ Nuevo Admin</a>
        <button class="btn-salir-menu" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <header class="header-principal">
        <div class="contenedor-logo-izq">
            <img src="" class="logo-inst" id="logo-izquierdo" style="display:none;">
        </div>

        <div class="header-textos">
            <h1 id="cabecera-titulo">Portal Cultural y Deportivo</h1>
            <h3 id="cabecera-subtitulo">Norte de Santander | San José de Cúcuta</h3>
        </div>

        <div class="contenedor-derecho">
            <div class="contenedor-logos-der">
                <img src="" class="logo-inst" id="logo-derecho-1" style="display:none;">
                <img src="" class="logo-inst" id="logo-derecho-2" style="display:none;">
            </div>
            <div class="contenedor-botones-admin">
                <a href="login.html" id="btn-ingresar-discreto" class="btn-ingresar-flotante">⚙️ Acceso Admin</a>
            </div>
        </div>
    </header>

    <div class="contenedor-maestro">
        <aside class="columna-eventos">
            <h2 class="titulo-seccion">Actualizaciones</h2>
            <div id="contenedor-transmisiones">
                <div style="text-align: center; padding: 20px; color: #666;">
                    <p style="font-size: 12px; margin: 0; font-weight: 600;">Cargando feed...</p>
                </div>
            </div>
        </aside>

        <main class="columna-galeria">
            <h2 class="titulo-seccion">Archivo Fotográfico</h2>
            <div id="contenedor-galeria-albumes">
                <div style="text-align: center; padding: 40px; color: #666;">
                    <p style="font-size: 12px; margin: 0; font-weight: 600;">Cargando acervo multimedia...</p>
                </div>
            </div>
        </main>
    </div>

    <footer class="footer-desarrollo">
        Plataforma gestionada por compukelc | compukelc@hotmail.com | cel. 3507973351
    </footer>

    <a href="registro_usuarios.html" class="btn-flotante-registro">
        <div class="btn-flotante-circulo" id="btn-flotante-circulo-reg">
            <img src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png" alt="Registro" id="img-icono-registro-flotante">
        </div>
        <span class="btn-flotante-texto">Registro</span>
    </a>

    <!-- Lightbox Modal (Oculto) -->
    <div id="visorLightbox" class="lightbox-modal">
        <span class="lightbox-cerrar" onclick="cerrarLightbox()">&times;</span>
        <button class="lightbox-btn lightbox-prev" onclick="cambiarImagen(-1)">&#10094;</button>
        <div class="lightbox-contenido"><img id="img-lightbox" class="lightbox-img" src=""></div>
        <button class="lightbox-btn lightbox-next" onclick="cambiarImagen(1)">&#10095;</button>
    </div>

    <script>
        const supabaseUrl = 'https://wcdxgzopaghmcqqvbluk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjZHhnem9wYWdobWNxcXZibHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODIxODQsImV4cCI6MjEwMzc1ODE4NH0.-LGiK5alHalxQ5b8c5XE_H3o-fIWB4Mj4tVZKpEYuyQ'; 
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { persistSession: false } });

        // VERIFICACIÓN DE SESIÓN
        const sesionGuardada = localStorage.getItem('sesion_activa');
        if (sesionGuardada) {
            const usuario = JSON.parse(sesionGuardada);
            document.getElementById('barra-admin').style.display = 'flex';
            document.getElementById('info-usuario-activo').textContent = `${usuario.nombres} (${usuario.rol})`;
            document.getElementById('btn-ingresar-discreto').style.display = 'none';
            document.getElementById('link-panel-admin').style.display = 'inline';
            if (usuario.rol === 'superadmin' || usuario.documento === '1090391929') {
                document.getElementById('link-registro').style.display = 'inline';
            }
        }
        function cerrarSesion() { localStorage.removeItem('sesion_activa'); window.location.reload(); }

        // CARGA DINÁMICA DE CONFIGURACIONES AVANZADAS
        async function cargarLogosInstitucionales() {
            const { data, error } = await clienteSupabase.from('configuracion').select('*').eq('id', 1).single();
            if (data && !error) {
                
                // 1. Textos y Fuentes de Cabecera
                if (data.cabecera_titulo) document.getElementById('cabecera-titulo').textContent = data.cabecera_titulo;
                if (data.cabecera_subtitulo) document.getElementById('cabecera-subtitulo').textContent = data.cabecera_subtitulo;
                if (data.cabecera_fuente) {
                    document.getElementById('cabecera-titulo').style.fontFamily = `'${data.cabecera_fuente}', sans-serif`;
                    document.getElementById('cabecera-subtitulo').style.fontFamily = `'${data.cabecera_fuente}', sans-serif`;
                }
                if (data.cabecera_tamano_titulo) document.getElementById('cabecera-titulo').style.fontSize = data.cabecera_tamano_titulo + 'px';
                if (data.cabecera_tamano_subtitulo) document.getElementById('cabecera-subtitulo').style.fontSize = data.cabecera_tamano_subtitulo + 'px';

                // 2. Imágenes de Logos
                if (data.logo_evento) {
                    const imgIzq = document.getElementById('logo-izquierdo');
                    imgIzq.src = data.logo_evento;
                    imgIzq.style.display = 'block';
                }
                if (data.logo_alcaldia) {
                    const imgDer1 = document.getElementById('logo-derecho-1');
                    imgDer1.src = data.logo_alcaldia;
                    imgDer1.style.display = 'block';
                }
                if (data.logo_gobernacion) {
                    const imgDer2 = document.getElementById('logo-derecho-2');
                    imgDer2.src = data.logo_gobernacion;
                    imgDer2.style.display = 'block';
                }

                // 3. Tamaños Individuales de Logos (Adaptación estática)
                if (data.tamano_logo_evento) document.getElementById('logo-izquierdo').style.height = data.tamano_logo_evento + 'px';
                if (data.tamano_logo_alcaldia) document.getElementById('logo-derecho-1').style.height = data.tamano_logo_alcaldia + 'px';
                if (data.tamano_logo_gobernacion) document.getElementById('logo-derecho-2').style.height = data.tamano_logo_gobernacion + 'px';

                // 4. Fondo General
                if (data.fondo_pantalla) {
                    document.body.style.background = `url('${data.fondo_pantalla}') no-repeat center center fixed`;
                    document.body.style.backgroundSize = 'cover';
                }

                // 5. Botón Flotante (Icono y Tamaño)
                if (data.icono_registro) {
                    document.getElementById('img-icono-registro-flotante').src = data.icono_registro;
                }
                if (data.tamano_icono_registro) {
                    const circulo = document.getElementById('btn-flotante-circulo-reg');
                    circulo.style.width = data.tamano_icono_registro + 'px';
                    circulo.style.height = data.tamano_icono_registro + 'px';
                }
            }
        }
        cargarLogosInstitucionales();
    </script>
</body>
</html>
