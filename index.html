<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Portal Multimedia Institucional - compukelc</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="barra-sesion" id="barra-admin" style="display: none;">
        <span id="info-usuario-activo"></span>
        <a href="admin.html" id="link-panel-admin" style="display: none;">⚙️ Panel</a>
        <a href="registro.html" id="link-registro" style="display: none;">+ Nuevo Admin</a>
        <button class="btn-salir-menu" onclick="cerrarSesion()">Salir</button>
    </div>

    <header class="header-principal">
        <a href="login.html" id="btn-ingresar-discreto" class="btn-ingresar-flotante">Acceder</a>
        <h1>Portal Cultural y Deportivo</h1>
        <h3>Norte de Santander | San José de Cúcuta</h3>
    </header>

    <div class="contenedor-maestro">
        <aside class="columna-eventos">
            <h2 class="titulo-seccion">Actualizaciones</h2>
            <div id="contenedor-transmisiones">
                <div style="text-align: center; padding: 20px; color: #65676B;">
                    <p style="font-size: 13px; margin: 0; font-weight: 600;">Cargando feed...</p>
                </div>
            </div>
        </aside>

        <main class="columna-galeria">
            <h2 class="titulo-seccion">Archivo Multimedia</h2>
            <div id="contenedor-galeria-albumes">
                <div style="text-align: center; padding: 40px; color: #65676B;">
                    <p style="font-size: 13px; margin: 0; font-weight: 600;">Cargando videos y fotos...</p>
                </div>
            </div>
        </main>
    </div>

    <footer class="footer-desarrollo">
        Plataforma gestionada por compukelc | compukelc@hotmail.com | cel. 3507973351
    </footer>

    <div id="visorLightbox" class="lightbox-modal">
        <span class="lightbox-cerrar" onclick="cerrarLightbox()">&times;</span>
        <button class="lightbox-btn lightbox-prev" onclick="cambiarImagen(-1)">&#10094;</button>
        <div class="lightbox-contenido">
            <img id="img-lightbox" class="lightbox-img" src="">
        </div>
        <button class="lightbox-btn lightbox-next" onclick="cambiarImagen(1)">&#10095;</button>
    </div>

    <script>
        const supabaseUrl = 'https://wcdxgzopaghmcqqvbluk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjZHhnem9wYWdobWNxcXZibHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODIxODQsImV4cCI6MjEwMzc1ODE4NH0.-LGiK5alHalxQ5b8c5XE_H3o-fIWB4Mj4tVZKpEYuyQ'; 
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { persistSession: false } });

        let todasLasFotos = [];
        let indiceActual = 0;

        const sesionGuardada = localStorage.getItem('sesion_activa');
        if (sesionGuardada) {
            const usuario = JSON.parse(sesionGuardada);
            document.getElementById('barra-admin').style.display = 'flex';
            document.getElementById('info-usuario-activo').textContent = `${usuario.nombres} (${usuario.rol})`;
            document.getElementById('btn-ingresar-discreto').style.display = 'none';
            document.getElementById('link-panel-admin').style.display = 'inline';

            if (usuario.rol === 'superadmin' || usuario.documento === '1090391929') {
                document.getElementById('link-registro').style.display = 'inline';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('sesion_activa');
            window.location.reload();
        }

        async function cargarEventosYPublicidad() {
            const contenedor = document.getElementById('contenedor-transmisiones');
            const { data, error } = await clienteSupabase.from('actividades').select('*').order('id', { ascending: false });

            if (error || !data || data.length === 0) return contenedor.innerHTML = "<div style='text-align: center; padding: 20px; color: #65676B;'><p style='font-size: 13px; margin: 0;'>No hay publicaciones recientes.</p></div>";

            contenedor.innerHTML = '';
            data.forEach(evento => {
                let imagenBanner = evento.url_publicidad ? `<img src="${evento.url_publicidad}" class="banner-publicidad">` : '';
                let botonesHTML = '';
                
                if(evento.url_youtube) botonesHTML += `<a href="${evento.url_youtube}" target="_blank" class="btn-link">YouTube</a>`;
                if(evento.url_facebook) botonesHTML += `<a href="${evento.url_facebook}" target="_blank" class="btn-link">Facebook</a>`;
                if(evento.url_tiktok) botonesHTML += `<a href="${evento.url_tiktok}" target="_blank" class="btn-link">TikTok</a>`;
                if(evento.url_x) botonesHTML += `<a href="${evento.url_x}" target="_blank" class="btn-link">X</a>`;

                let esDeporte = (evento.tipo === 'Deporte');
                let claseAvatar = esDeporte ? 'avatar-deporte' : '';
                let letraAvatar = esDeporte ? 'O' : 'G'; // O de Olímpicos, G de Gobernación

                contenedor.innerHTML += `
                    <div class="post-social">
                        <div class="post-header">
                            <div class="post-avatar ${claseAvatar}">${letraAvatar}</div>
                            <div class="post-meta">
                                <h3>${evento.titulo || 'Publicación sin título'}</h3>
                                <span>${evento.tipo || 'Actualidad'}</span>
                            </div>
                        </div>
                        ${imagenBanner}
                        <div class="post-actions">${botonesHTML}</div>
                    </div>
                `;
            });
        }

        async function cargarAlbumesGaleria() {
            const contenedor = document.getElementById('contenedor-galeria-albumes');
            
            const { data: albumes, error } = await clienteSupabase
                .from('albumes_galeria')
                .select('*, fotos_album(*)')
                .order('id', { ascending: false });

            if (error || !albumes || albumes.length === 0) {
                return contenedor.innerHTML = "<div style='text-align: center; padding: 40px; color: #65676B;'><p style='font-size: 13px; margin: 0;'>No hay álbumes creados.</p></div>";
            }

            contenedor.innerHTML = '';
            todasLasFotos = []; 

            albumes.forEach(album => {
                let fotosHTML = '';
                if (album.fotos_album && album.fotos_album.length > 0) {
                    album.fotos_album.forEach(foto => {
                        const indiceGlobal = todasLasFotos.length;
                        todasLasFotos.push(foto.url_foto);
                        fotosHTML += `<div class="foto-item" onclick="abrirLightbox(${indiceGlobal})"><img src="${foto.url_foto}" loading="lazy"></div>`;
                    });
                } else {
                    fotosHTML = `<p style="font-size:13px; color:#65676B;">No hay contenido en este álbum.</p>`;
                }

                contenedor.innerHTML += `
                    <div class="album-social">
                        <div class="album-header">
                            <h3 class="album-titulo">${album.titulo}</h3>
                            <p class="album-descripcion">${album.descripcion || ''}</p>
                        </div>
                        <div class="grid-youtube">${fotosHTML}</div>
                    </div>
                `;
            });
        }

        function abrirLightbox(indice) {
            indiceActual = indice;
            document.getElementById('img-lightbox').src = todasLasFotos[indiceActual];
            document.getElementById('visorLightbox').style.display = 'flex';
        }

        function cerrarLightbox() {
            document.getElementById('visorLightbox').style.display = 'none';
        }

        function cambiarImagen(direccion) {
            indiceActual += direccion;
            if (indiceActual >= todasLasFotos.length) indiceActual = 0;
            else if (indiceActual < 0) indiceActual = todasLasFotos.length - 1;
            document.getElementById('img-lightbox').src = todasLasFotos[indiceActual];
        }

        document.addEventListener('keydown', function(event) {
            if (document.getElementById('visorLightbox').style.display === 'flex') {
                if (event.key === "Escape") cerrarLightbox();
                if (event.key === "ArrowRight") cambiarImagen(1);
                if (event.key === "ArrowLeft") cambiarImagen(-1);
            }
        });

        cargarEventosYPublicidad();
        cargarAlbumesGaleria();
    </script>
</body>
</html>
