<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Portal Administrativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 80vh; }
        .formulario { width: 100%; max-width: 380px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .fila-password { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .fila-password input { margin-bottom: 0; }
        button { width: 100%; padding: 12px; background: #003366; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .error { color: red; font-size: 12px; margin-bottom: 15px; display: none; text-align: center; }
        .link-registro { display: block; text-align: center; margin-top: 15px; font-size: 12px; color: #003366; text-decoration: none; }
    </style>
</head>
<body>

    <div class="formulario">
        <h2 style="text-align: center; color: #003366; margin-bottom: 25px;">Acceso Administrativo</h2>
        
        <input type="text" inputmode="numeric" id="documento-login" placeholder="Documento de Identidad" required>
        
        <div class="fila-password">
            <input type="password" id="clave-login" placeholder="Contraseña" required>
            <button type="button" id="btn-ver-login" style="width: auto; padding: 10px;">Ver</button>
        </div>

        <p id="mensaje-error-login" class="error"></p>

        <button onclick="iniciarSesion()">Ingresar al Sistema</button>
        
        <a href="registro.html" class="link-registro">¿No tienes cuenta? Solicitar acceso</a>
    </div>

    <script>
        const supabaseUrl = 'https://wcdxgzopaghmcqqvbluk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjZHhnem9wYWdobWNxcXZibHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODIxODQsImV4cCI6MjEwMzc1ODE4NH0.-LGiK5alHalxQ5b8c5XE_H3o-fIWB4Mj4tVZKpEYuyQ'; 
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('btn-ver-login').addEventListener('click', function() {
            const campo = document.getElementById('clave-login');
            campo.type = campo.type === 'password' ? 'text' : 'password';
            this.textContent = campo.type === 'password' ? 'Ver' : 'Ocultar';
        });

        async function iniciarSesion() {
            const documento = document.getElementById('documento-login').value.trim();
            const clave = document.getElementById('clave-login').value;
            const error = document.getElementById('mensaje-error-login');

            if (!documento || !clave) {
                error.textContent = "Ingrese documento y contraseña.";
                error.style.display = "block"; return;
            }
            error.style.display = "none";

            try {
                const { data, error: dbError } = await clienteSupabase
                    .from('perfiles_administrativos')
                    .select('*')
                    .eq('documento', documento)
                    .single();

                if (dbError || !data) throw new Error("Documento no registrado.");
                if (data.clave !== clave) throw new Error("Contraseña incorrecta.");

                if (data.rol !== 'superadmin' && data.estado !== 'autorizado') {
                    if (data.estado === 'pendiente') throw new Error("Su cuenta está pendiente de aprobación.");
                    if (data.estado === 'bloqueado') throw new Error("Su cuenta está bloqueada.");
                    throw new Error("Acceso no autorizado.");
                }

                localStorage.setItem('sesion_activa', JSON.stringify({
                    documento: data.documento,
                    nombres: data.nombres,
                    rol: data.rol
                }));

                alert(`¡Bienvenido, ${data.nombres}!`);
                window.location.href = 'index.html';

            } catch (err) {
                error.textContent = err.message;
                error.style.display = "block";
            }
        }
    </script>
</body>
</html>
