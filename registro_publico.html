<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personal Educativo - compukelc</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">

    <style>
        .fondo-registro { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .tarjeta-registro { background: var(--blanco); width: 100%; max-width: 600px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; border-top: 6px solid var(--rojo-bandera); }
        .cabecera-registro { background: linear-gradient(135deg, var(--azul-institucional), #004080); padding: 30px; text-align: center; color: white; }
        .cabecera-registro h2 { margin: 0; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 22px; }
        .cabecera-registro p { margin: 10px 0 0; font-size: 13px; opacity: 0.9; }
        .cuerpo-registro { padding: 30px; }
        .grupo-input { margin-bottom: 20px; }
        .grupo-input label { display: block; font-size: 12px; font-weight: 700; color: var(--azul-institucional); margin-bottom: 8px; text-transform: uppercase;}
        .input-form { width: 100%; padding: 12px 15px; border: 2px solid #e1e5eb; border-radius: 6px; font-family: 'Montserrat', sans-serif; font-size: 14px; color: var(--text-main); box-sizing: border-box; transition: border-color 0.3s; }
        .input-form:focus { border-color: var(--rojo-bandera); outline: none; }
        .fila-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-registrar { width: 100%; background: var(--rojo-bandera); color: white; border: none; padding: 15px; font-size: 15px; font-weight: 800; text-transform: uppercase; border-radius: 6px; cursor: pointer; transition: background 0.3s, transform 0.2s; margin-top: 10px; box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3); }
        .btn-registrar:hover { background: #b71c1c; transform: translateY(-2px); }
        .btn-registrar:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none;}
        .enlace-volver { display: block; text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600;}
        .enlace-volver:hover { color: var(--azul-institucional); text-decoration: underline; }
        .loader-sheets { font-size: 11px; color: #ff9800; font-weight: bold; float: right; margin-top: -25px; margin-right: 5px; position: relative; z-index: 2;}
        
        /* Animación suave para los campos condicionales */
        .campo-condicional { display: none; animation: aparecer 0.4s ease forwards; background: #f8f9fa; padding: 15px; border-radius: 6px; border-left: 4px solid var(--amarillo-oro); margin-bottom: 20px;}
        @keyframes aparecer { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="franja-superior"></div>

    <div class="fondo-registro">
        <div class="tarjeta-registro">
            <div class="cabecera-registro">
                <h2>Directorio Educativo Público</h2>
                <p>Norte de Santander - Registro de Personal</p>
            </div>
            
            <div class="cuerpo-registro">
                <form id="formulario-registro" onsubmit="procesarRegistro(event)">
                    
                    <div class="fila-doble">
                        <div class="grupo-input">
                            <label>Número de Documento</label>
                            <input type="number" id="reg-documento" class="input-form" placeholder="Ej: 1090..." required>
                        </div>
                        <div class="grupo-input">
                            <label>Nombres y Apellidos</label>
                            <input type="text" id="reg-nombres" class="input-form" placeholder="Nombres completos" required>
                        </div>
                    </div>

                    <div class="grupo-input">
                        <label>Rol Funcional (Define su tipo de vinculación)</label>
                        <select id="reg-rol" class="input-form" onchange="mostrarCamposVinculacion()" required>
                            <option value="">-- Seleccione su cargo --</option>
                            <option value="Docente">Docente</option>
                            <option value="Directivo Docente">Directivo Docente (Rector/Coordinador)</option>
                            <option value="Administrativo">Personal Administrativo</option>
                            <option value="Contratista">Contratista Externo / Apoyo</option>
                        </select>
                    </div>

                    <!-- 1. Para Docentes y Directivos -->
                    <div id="condicional-docente" class="campo-condicional">
                        <label>Tipo de Nombramiento Docente</label>
                        <select id="tipo-vinculacion-docente" class="input-form">
                            <option value="">-- Seleccione nombramiento --</option>
                            <option value="En Propiedad (Carrera Docente)">En Propiedad (Carrera Docente)</option>
                            <option value="En Período de Prueba">En Período de Prueba</option>
                            <option value="Provisional">Provisional</option>
                            <option value="Etnoeducador">Etnoeducador</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <!-- 2. Para Administrativos -->
                    <div id="condicional-administrativo" class="campo-condicional">
                        <label>Tipo de Nombramiento Administrativo</label>
                        <select id="tipo-vinculacion-admin" class="input-form">
                            <option value="">-- Seleccione nombramiento --</option>
                            <option value="Carrera Administrativa">Carrera Administrativa</option>
                            <option value="Provisionalidad">Provisionalidad</option>
                            <option value="Libre Nombramiento y Remoción">Libre Nombramiento y Remoción</option>
                            <option value="Período de Prueba">Período de Prueba</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <!-- 3. Para Contratistas -->
                    <div id="condicional-contrato" class="campo-condicional">
                        <label>Tipo de Contrato (Ley 80)</label>
                        <select id="tipo-vinculacion-contrato" class="input-form">
                            <option value="">-- Seleccione contrato --</option>
                            <option value="Prestación de Servicios Profesionales">Prestación de Servicios Profesionales</option>
                            <option value="Prestación de Apoyo a la Gestión">Prestación de Apoyo a la Gestión</option>
                            <option value="Contrato de Obra / Consultoría">Contrato de Obra / Consultoría</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="fila-doble">
                        <div class="grupo-input">
                            <label>Municipio <span id="indicador-carga" class="loader-sheets">Cargando...</span></label>
                            <select id="reg-municipio" class="input-form" onchange="actualizarInstituciones()" required disabled>
                                <option value="">Esperando datos...</option>
                            </select>
                        </div>
                        <div class="grupo-input">
                            <label>Institución Educativa</label>
                            <select id="reg-institucion" class="input-form" required disabled>
                                <option value="">Seleccione Municipio</option>
                            </select>
                        </div>
                    </div>

                    <div class="fila-doble">
                        <div class="grupo-input">
                            <label>Crear Contraseña (Opcional)</label>
                            <input type="password" id="reg-clave1" class="input-form" placeholder="Mínimo 8 caracteres">
                        </div>
                        <div class="grupo-input">
                            <label>Confirmar Contraseña</label>
                            <input type="password" id="reg-clave2" class="input-form" placeholder="Repita la clave">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="btn-registrar" style="background:#002B5C;">Registrar mis datos en el Directorio</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN SUPABASE
        const supabaseUrl = 'https://wcdxgzopaghmcqqvbluk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjZHhnem9wYWdobWNxcXZibHVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODIxODQsImV4cCI6MjEwMzc1ODE4NH0.-LGiK5alHalxQ5b8c5XE_H3o-fIWB4Mj4tVZKpEYuyQ'; 
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // LÓGICA DE CAMPOS CONDICIONALES
        function mostrarCamposVinculacion() {
            const rol = document.getElementById('reg-rol').value;
            
            const divs = ['condicional-docente', 'condicional-administrativo', 'condicional-contrato'];
            const selects = ['tipo-vinculacion-docente', 'tipo-vinculacion-admin', 'tipo-vinculacion-contrato'];
            
            divs.forEach(id => document.getElementById(id).style.display = 'none');
            selects.forEach(id => document.getElementById(id).required = false);

            if (rol === 'Docente' || rol === 'Directivo Docente') {
                document.getElementById('condicional-docente').style.display = 'block';
                document.getElementById('tipo-vinculacion-docente').required = true;
            } 
            else if (rol === 'Administrativo') {
                document.getElementById('condicional-administrativo').style.display = 'block';
                document.getElementById('tipo-vinculacion-admin').required = true;
            } 
            else if (rol === 'Contratista') {
                document.getElementById('condicional-contrato').style.display = 'block';
                document.getElementById('tipo-vinculacion-contrato').required = true;
            }
        }

        // LÓGICA GOOGLE SHEETS
        const urlGoogleSheetsCSV = "https://docs.google.com/spreadsheets/d/1Y0jIu7j5r-pOItt2RCcoJC9kWeH1qyjCUf-gT2XgFPc/export?format=csv";
        let directorioData = {};

        function interpretarCSV(texto) {
            let p = '', fila = [''], datosRetorno = [fila], i = 0, r = 0, s = !0, l;
            for (let l of texto) {
                if ('"' === l) { if (s && l === p) fila[i] += l; s = !s; } 
                else if (',' === l && s) l = fila[++i] = '';
                else if ('\n' === l && s) { if ('\r' === p) fila[i] = fila[i].slice(0, -1); fila = datosRetorno[++r] = [l = '']; i = 0; } 
                else fila[i] += l; p = l;
            }
            return datosRetorno;
        }

        async function cargarDirectorioGoogleSheets() {
            try {
                const respuesta = await fetch(urlGoogleSheetsCSV);
                const textoCsv = await respuesta.text();
                const matrizDatos = interpretarCSV(textoCsv);
                
                for(let i = 1; i < matrizDatos.length; i++) {
                    if(matrizDatos[i].length >= 2) {
                        let municipio = matrizDatos[i][0].trim();
                        let institucion = matrizDatos[i][1].trim();
                        if(municipio && institucion) {
                            if(!directorioData[municipio]) directorioData[municipio] = [];
                            if(!directorioData[municipio].includes(institucion)) directorioData[municipio].push(institucion);
                        }
                    }
                }
                const selectMuni = document.getElementById('reg-municipio');
                selectMuni.innerHTML = '<option value="">-- Seleccione Municipio --</option>';
                Object.keys(directorioData).sort().forEach(muni => {
                    const opt = document.createElement('option'); opt.value = muni; opt.textContent = muni; selectMuni.appendChild(opt);
                });
                document.getElementById('indicador-carga').style.display = 'none';
                selectMuni.disabled = false;
            } catch (error) {
                console.error("Error Sheets:", error);
                document.getElementById('indicador-carga').textContent = "Error de conexión";
                document.getElementById('indicador-carga').style.color = "red";
            }
        }

        function actualizarInstituciones() {
            const muni = document.getElementById('reg-municipio').value;
            const selectInst = document.getElementById('reg-institucion');
            selectInst.innerHTML = '<option value="">-- Seleccione Institución --</option>';
            if(muni && directorioData[muni]) {
                directorioData[muni].sort().forEach(inst => {
                    const opt = document.createElement('option'); opt.value = inst; opt.textContent = inst; selectInst.appendChild(opt);
                });
                selectInst.disabled = false;
            } else { selectInst.disabled = true; }
        }

        async function procesarRegistro(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-submit');
            
            const doc = document.getElementById('reg-documento').value.trim();
            const nombres = document.getElementById('reg-nombres').value.trim();
            const rol = document.getElementById('reg-rol').value;
            const muni = document.getElementById('reg-municipio').value;
            const inst = document.getElementById('reg-institucion').value;
            const clave1 = document.getElementById('reg-clave1').value;
            const clave2 = document.getElementById('reg-clave2').value;

            let tipoVinculacion = "";
            if (rol === 'Docente' || rol === 'Directivo Docente') {
                tipoVinculacion = document.getElementById('tipo-vinculacion-docente').value;
            } else if (rol === 'Administrativo') {
                tipoVinculacion = document.getElementById('tipo-vinculacion-admin').value;
            } else if (rol === 'Contratista') {
                tipoVinculacion = document.getElementById('tipo-vinculacion-contrato').value;
            }

            if(clave1 && clave1 !== clave2) {
                return alert("Las contraseñas no coinciden. Por favor, verifique.");
            }

            btn.disabled = true;
            btn.textContent = "Procesando...";

            const { error } = await clienteSupabase.from('personal_educativo').insert([{
                documento: doc,
                nombres: nombres,
                rol: rol,
                tipo_vinculacion: tipoVinculacion,
                municipio: muni,
                institucion: inst,
                clave: clave1,
                estado: 'pendiente'
            }]);

            if (error) {
                alert("Hubo un error al registrar: " + error.message);
                btn.disabled = false;
                btn.textContent = "Registrar mis datos en el Directorio";
            } else {
                alert(`¡Registro completado con éxito, ${nombres}!\n\nSus datos han sido enviados correctamente al directorio institucional.`);
                document.getElementById('formulario-registro').reset();
                mostrarCamposVinculacion(); 
                btn.disabled = false;
                btn.textContent = "Registrar mis datos en el Directorio";
            }
        }

        cargarDirectorioGoogleSheets();
    </script>
</body>
</html>
